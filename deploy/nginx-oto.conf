# /etc/nginx/sites-available/oto  — обратный прокси с HTTPS для web-приложения ОТО
# Замените oto.example.ru на своё доменное имя. Сертификат: sudo certbot --nginx -d oto.example.ru
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name oto.example.ru;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;            # импорт GeoJSON-слоёв
    }
    location /ws/ {                           # чат команды (WebSocket)
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
